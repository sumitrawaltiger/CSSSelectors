<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Element Selector */
        div {
            color: red;
            font-size: 20px;
            width: 200px;
            height: 100px;
            background-color: lightgray;
            display: flex;
            align-items: center;
            justify-content: center;
        }   
        /* ID Selector */
        span#idSelector {
            color: blue;
            font-size: 18px;
            width: 200px;
            height: 100px;
            background-color: lightyellow;
            display: flex;
            align-items: center;
            justify-content: center;
            display: block;
        }
        /* Class Selector */
        span.classSelector {
            color: green;
            font-size: 16px;
            width: 200px;
            height: 100px;
            background-color: lightblue;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Attribute Selector */
        a[href="https://www.google.com"] {
            color: purple;
            font-size: 14px;
            width: 200px;
            height: 100px;
            background-color: lightpink;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Universal Selector */
        * {
            margin: 10px;
            padding: 10px;
            border: 1px solid black;
           
        }
        /* Grouping Selector */
        div, span#idSelector, span.classSelector, a[href="https://www.google.com"] {
            border-radius: 10px;
            display: inline-block;

        }
        /* Pseudo-class Selector */
        a:hover {
            background-color: yellow;
            color: red;
        }
        h1::after {
            content: url("https://i.pinimg.com/originals/a8/50/2c/a8502cb158d5eac79b7902fdc76074e6.gif");
            color: gray;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div>CSS Element Selector</div>
    <span id="idSelector">CSS ID Selector</span>
    <span class="classSelector">CSS Class Selector</span>
    <a href="https://www.google.com">CSS Attribute Selector</a>
    <h1>CSS Universal Selector</h1>
</body>
</html>
